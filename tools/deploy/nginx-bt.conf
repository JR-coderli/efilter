# 宝塔面板 Nginx 反向代理配置示例
#
# 项目结构说明：
# - 前端静态文件：/opt/efilter/frontend/index.html
# - Go 后端工作目录：/opt/efilter/backend/risk-engine/
# - Go 后端监听端口：127.0.0.1:8080
#
# 宝塔网站目录建议：/opt/efilter/（即使全部走反代，也建议指向项目根目录）
#
# 使用方法：
# 1. 在宝塔面板 "网站" 中添加一个站点（PHP 版本选 "纯静态"）。
# 2. 网站目录填写：/opt/efilter/
# 3. 进入该站点 -> "设置" -> "配置文件"。
# 4. 在 server { ... } 块内，根据下方两种方案选择一种粘贴。
# 5. 如果站点已有其他 location 块，请勿直接覆盖整个文件。
# 6. 保存后，宝塔会自动重载 Nginx。

# ============================================================
# 方案 A：全部请求走反代（推荐，最简单，与当前代码行为一致）
# ============================================================
# 说明：所有请求都转发给 Go 后端，由 Gin 的 NoRoute 统一返回前端页面。
# 优点：配置简单，前端路由、API、dashboard 都由后端处理，不易出错。

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket 支持（如后续需要）
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# ============================================================
# 方案 B：Nginx 直接服务前端静态文件，仅 API 走后端
# ============================================================
# 说明：Nginx 直接返回 frontend/index.html，只有 /api/ 和 /dashboard/ 数据接口走反代。
# 优点：减轻后端压力，前端页面响应更快。
# 注意：如果前端增加了路由或静态资源，可能需要同步调整此处。
#
# 使用方案 B 时，请注释掉上方的方案 A 的 location / 块，并取消注释下方配置：
