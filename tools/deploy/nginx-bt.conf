# 宝塔面板 Nginx 反向代理配置示例
# 使用方法：
# 1. 在宝塔面板 "网站" 中添加一个站点（PHP 版本选 "纯静态"）。
# 2. 进入该站点 -> "设置" -> "配置文件"。
# 3. 在 server { ... } 块内，添加下方的 location / 配置（可放在原有 location 之前或替换默认 location）。
# 4. 如果站点已有其他 location 块，请勿直接覆盖整个文件。
# 5. 保存后，宝塔会自动重载 Nginx。

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket 支持（如后续需要）
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# 可选：如果希望 Nginx 直接服务静态资源，可取消注释下方配置。
# 注意：当前项目前端仅有 frontend/index.html，由后端 NoRoute 统一返回，
# 因此默认全部走反代即可，无需额外配置静态目录。
